<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanos Snap</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="brand">
      <div class="stone">✦</div>
      <div>
        <h1>THANOS SNAP</h1>
        <p>Google Meet camera effect</p>
      </div>
    </div>
    <div id="status" class="status">Checking companion app…</div>
    <button id="connect" class="primary">Connect / Enable</button>
    <button id="stop" class="secondary">Disable effect</button>
    <p class="hint">Select <b>OBS Virtual Camera</b> in Google Meet. Show your palm, then make a fist or pinch thumb and index finger.</p>
    <p id="error" class="error"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
